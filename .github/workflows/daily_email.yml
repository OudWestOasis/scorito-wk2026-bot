name: Scorito dagmail

# 08:00 Europe/Amsterdam. Cron is UTC en kent geen zomertijd, dus twee triggers:
#   06:00 UTC = 08:00 in zomertijd (CEST)
#   07:00 UTC = 08:00 in wintertijd (CET)
# De code (bot.py email) verstuurt alléén als het in NL daadwerkelijk 08:00 is
# en hooguit 1× per dag — dus de "verkeerde" trigger doet niets.
on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: 'email (08:00-check) of emailtest (forceer nu)'
        default: 'email'
        required: false

permissions:
  contents: write

concurrency:
  group: scorito-mail
  cancel-in-progress: false

jobs:
  mail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python opzetten (met pip-cache)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Dag-mail draaien
        env:
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          BOT_CMD: ${{ github.event.inputs.command || 'email' }}
        run: python bot.py "$BOT_CMD"

      - name: State terugcommitten (alleen bij wijziging)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Geen state-wijziging — niets te committen."
          else
            git commit -m "chore: update state [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          fi
